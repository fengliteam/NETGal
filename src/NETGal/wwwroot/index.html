<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NETGal 编辑器</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand-mark">NG</div>
    <div class="brand-copy"><strong>NETGal 编辑器</strong><span>原生视觉小说引擎</span></div>
    <div class="topbar-spacer"></div>
    <div id="save-state" class="save-state"><span class="status-dot"></span> 就绪</div>
    <button class="button button-ghost" id="validate-button">检查项目</button>
    <button class="button button-primary" id="save-button">保存项目</button>
  </header>

  <main class="workspace">
    <aside class="sidebar panel-border">
      <div class="side-heading"><div><span class="eyebrow">项目</span><h1 id="project-title">正在加载...</h1></div><button class="icon-button" id="add-scene-button" title="新增场景">+</button></div>
      <div class="scene-list" id="scene-list"></div>
      <div class="sidebar-footer"><span class="live-dot"></span><span id="scene-count">0 个场景</span><span class="footer-divider"></span><span>v0.1</span></div>
    </aside>

    <section class="editor-column">
      <div class="workspace-tabs"><button class="tab active" data-tab="scene">场景编辑</button><button class="tab" data-tab="settings">项目设置</button><div class="tab-fill"></div><button class="preview-link" id="open-player-button"><span>▶</span> 播放预览 <span class="shortcut">Ctrl ↗</span></button></div>
      <div class="editor-scroll">
        <div class="scene-header"><div><div class="breadcrumb">场景 <span>/</span> <span id="scene-breadcrumb">INTRO</span></div><h2 id="scene-heading">序章</h2></div><div class="scene-actions"><button class="icon-button" id="duplicate-scene-button" title="复制场景">⧉</button><button class="icon-button danger-hover" id="delete-scene-button" title="删除场景">⌫</button></div></div>
        <div id="scene-tab" class="tab-content active">
          <div class="form-grid two-up">
            <label class="field"><span>场景 ID</span><input id="scene-id-input" spellcheck="false"></label>
            <label class="field"><span>显示标题</span><input id="scene-title-input"></label>
          </div>
          <div class="section-label"><span>舞台</span><span class="section-line"></span><span class="muted">可选背景图片</span></div>
          <div class="stage-card"><div class="stage-preview" id="stage-preview"><div class="stage-sky"></div><div class="stage-ground"></div><span class="stage-empty">未选择背景</span></div><div class="stage-controls"><label class="field"><span>背景路径</span><input id="background-input" placeholder="assets/your-background.jpg"></label><p class="hint">把文件放入项目的 <code>assets</code> 文件夹。留空则使用默认舞台。</p></div></div>
          <div class="section-label"><span>对白</span><span class="section-line"></span></div>
          <div class="dialogue-card"><div class="form-grid two-up"><label class="field"><span>说话人</span><input id="speaker-input"></label><label class="field"><span>角色标签 <em>可选</em></span><input id="character-input" placeholder="例如：微笑"></label></div><label class="field"><span>对白内容</span><textarea id="text-input" rows="5" placeholder="这个场景发生了什么？"></textarea><span class="character-count" id="character-count">0 字</span></label></div>
          <div class="section-label choices-heading"><span>选项</span><span class="section-line"></span><button class="mini-button" id="add-choice-button">+ 新增选项</button></div>
          <div id="choices-list" class="choices-list"></div>
        </div>
        <div id="settings-tab" class="tab-content">
          <div class="settings-intro"><span class="settings-icon">◎</span><div><h3>项目设置</h3><p>这些内容会保存到 <code>game.json</code>，并随导出游戏一起使用。</p></div></div>
          <div class="form-grid two-up"><label class="field"><span>游戏标题</span><input id="game-title-input"></label><label class="field"><span>作者</span><input id="author-input"></label><label class="field"><span>版本</span><input id="version-input"></label><label class="field"><span>起始场景</span><select id="start-scene-input"></select></label></div>
          <div class="settings-note"><strong>保持简单。</strong><span>NETGal 使用可读 JSON 保存剧情，方便版本管理和手动编辑。</span></div>
        </div>
        <div id="issues-panel" class="issues-panel hidden"></div>
      </div>
    </section>
    <aside class="preview-column">
      <div class="preview-head"><div><span class="eyebrow">实时预览</span><h2>故事播放器</h2></div><span class="preview-indicator"><span class="live-dot"></span> 实时</span></div>
      <div class="player-frame" id="player-frame"><div class="player-backdrop" id="player-backdrop"><div class="player-vignette"></div><div class="player-scene-label" id="player-scene-label">序章</div><div class="player-dialogue"><div class="player-speaker" id="player-speaker">旁白</div><div class="player-text" id="player-text"></div><div class="player-choices" id="player-choices"></div></div></div></div>
      <div class="preview-footer"><span>编辑时自动更新预览</span><button class="text-button" id="restart-preview-button">重新开始 ↺</button></div>
    </aside>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
